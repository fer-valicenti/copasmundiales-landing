name: Sync prices from Empretienda

on:
  schedule:
    - cron: "0 13 * * *" # todos los dias ~10:00 (Argentina, UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        run: node scripts/sync-empretienda.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html scripts/empretienda-sync-state.json
            git commit -m "Auto-sync prices from Empretienda"
            git push
          else
            echo "Sin cambios para commitear."
          fi
